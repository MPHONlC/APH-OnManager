name: "\u2705 APH-OnManager Test Checklist (PC)"
description: Run through APH-OnManager's PC test checklist and report results
title: '[TEST][PC] '
labels:
- testing
assignees:
- MPHONlC
body:
- type: markdown
  attributes:
    value: Thanks for testing **APH-OnManager** on PC! Check off everything you actually tested and confirmed working. Anything broken or partly working, describe it in the notes field at the end instead of checking it off.
- type: input
  id: version
  attributes:
    label: Add-on version
    placeholder: e.g. 2026.09.29.21.48
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
    - PC (NA)
    - PC (EU)
    - PC (PTS)
  validations:
    required: true
- type: checkboxes
  id: pc_tests
  attributes:
    label: PC tests confirmed working
    options:
    - label: 'Status icons: Open Add-Ons (Esc > Add-Ons). Look at rows of an add-on with a Lua error, an outdated one, one missing a required library, one with an optional library switched off.'
    - label: 'Tooltip: Hover a status icon, then hover the add-on name.'
    - label: 'Yellow icon: Click a yellow (outdated) icon.'
    - label: 'Search: Type part of an add-on name in the AoM search box. Press Down, Up, then Enter.'
    - label: 'Categories: Use the category filter dropdown to pick Libraries, then a category of your own.'
    - label: 'Move to category: Right-click an add-on row and move it to another category.'
    - label: 'Category manager: Type /libcategories. Create (New Category or F), rename and delete a category, then press Reset List (Q) and Reset Categories (Z).'
    - label: 'Category window: Open /libcategories, drag it by its header, scroll the list and close it with the X.'
    - label: 'Suggested categories: On a fresh profile with add-ons installed, open the Add-Ons list for the first time.'
    - label: 'Unused libraries: Type /libcheck. Use Select All Libraries (F), Deselect All Libraries (R) and Apply Library Changes (E), and also try it with nothing to offer.'
    - label: 'Library versions: Type /libraryversioncheck.'
    - label: 'Disable Unused: Press Disable Unused (next to New Category, or above the search box with AddonSelector).'
    - label: 'Cascade: Untick an add-on that is the only user of a library.'
    - label: 'Profiles: Make a New Profile, Save Profile, change some add-ons, then Load the profile.'
    - label: 'Profile triggers: Click the cogwheel. Open a trigger group submenu and tick a trigger.'
    - label: 'Profile switching: Tick Enable Switching, set a profile''s trigger (for example a zone type) and travel there.'
    - label: 'Auto disable: Tick the auto disable checkbox and enter a PvP or group zone.'
    - label: 'Lua errors: With Suppress Lua Errors on, trigger any add-on error.'
    - label: 'Error announcement: With Suppress Lua Errors on, trigger an add-on error twice from the same add-on.'
    - label: 'Saved variables: Look at the Save Size figure and press Orphaned Saves.'
    - label: 'Large saved data: Log in with an add-on holding a very large amount of saved data (or get the total near the game''s limit), then leave the game world (reload).'
    - label: 'Profile switch declined: Enter a zone that triggers a profile switch and close the Switch Profile dialog with Cancel (or let it time out).'
    - label: 'Save alerts: Type /aomsavealerts twice.'
    - label: 'Outdated add-ons: Log in with an add-on older than the version AoM has on record.'
    - label: 'Delete settings: Click the grey icon of an add-on and choose Delete Settings.'
    - label: 'Layouts: Test the Add-Ons window with: nothing extra, PerfectPixel only, AddonSelector only, both.'
    - label: 'Keybinds: Open Controls and look for the APH-On Manager category. Use New Category, Reset List, Reset Categories and the library keys in their windows.'
    - label: 'Bug report: Type /aombugreport.'
    - label: 'Profile per character: Load profile A on one character, log in another character and load profile B, then go back to the first character and open the profile list.'
- type: textarea
  id: notes
  attributes:
    label: Anything broken, partly working, or not tested
    description: 'One line per issue: which test, what happened instead of Expected.'
    placeholder: 'e.g. PC-L-04 Bug report: popup opened but API version line was blank'
