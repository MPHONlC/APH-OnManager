name: Release Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lua-check:
    permissions:
      contents: read
    uses: ./.github/workflows/lua-check.yml

  api-version-refresh:
    needs: lua-check
    uses: ./.github/workflows/api-version-refresh.yml
    secrets: inherit
    permissions:
      contents: write

  data-tables-refresh:
    needs: api-version-refresh
    uses: ./.github/workflows/data-tables-refresh.yml
    secrets: inherit
    permissions:
      contents: write

  console-data-refresh:
    needs: data-tables-refresh
    uses: ./.github/workflows/console-data-refresh.yml
    secrets: inherit
    permissions:
      contents: write

  version-refresh:
    needs: console-data-refresh
    uses: ./.github/workflows/version-refresh.yml
    secrets: inherit
    permissions:
      contents: write

  readme-badge-check:
    needs: version-refresh
    uses: ./.github/workflows/readme-badge-check.yml
    with:
      fix: true
    secrets: inherit
    permissions:
      contents: write

  localization-check:
    permissions:
      contents: read
    needs: readme-badge-check
    uses: ./.github/workflows/localization-check.yml

  broken-link-check:
    needs: localization-check
    uses: ./.github/workflows/broken-link-check.yml
    with:
      fix: true
    secrets: inherit
    permissions:
      contents: write

  slash-command-doc-check:
    permissions:
      contents: read
    needs: broken-link-check
    uses: ./.github/workflows/slash-command-doc-check.yml

  description-check:
    permissions:
      contents: read
    needs: slash-command-doc-check
    uses: ./.github/workflows/description-check.yml

  markdown-check:
    needs: description-check
    uses: ./.github/workflows/markdown-check.yml
    with:
      apply_fix: true
    secrets: inherit
    permissions:
      contents: write

  changelog-check:
    permissions:
      contents: read
    needs: markdown-check
    uses: ./.github/workflows/changelog-check.yml
