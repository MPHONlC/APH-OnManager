name: Version Refresh

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  refresh-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/eso-wait-for-libaph

      - uses: ./.github/actions/git-commit-signing
        with:
          ssh_signing_key: ${{ secrets.SSH_SIGNING_KEY }}

      - uses: ./.github/actions/version-refresh
        with:
          manifest_file: 'APH-OnManager.addon'
          calver: 'true'
          follow_repo: 'MPHONlC/LibAPH'
          follow_manifest: 'LibAPH.addon'
          utc_offset_hours: '8'
          changelog_md: 'CHANGELOG.md'
          generated_changelogs: 'CHANGELOG_BBCODE.txt CHANGELOG_GFM.txt CHANGELOG_COMMONMARK.txt'
          readme: 'README.md'
          sync: |
            CORE/APH-OnManager.lua::(AoM\.VERSION = ")([^"]*)(")
          git_name: 'MPHONlC'
          git_email: '207844175+MPHONlC@users.noreply.github.com'

      - name: Write the add-on's own rows with the new version
        uses: ./.github/actions/eso-own-data-row
        with:
          manifest_file: 'APH-OnManager.addon'
          folder: 'APH-OnManager'
          title: 'APH-On Manager'
          author: 'MPHONlC'
          pc_file: 'DATA/KnownAddonVersions.lua'
          console_file: 'DATA/KnownConsoleAddons.lua'

      - name: Commit the own rows
        run: |
          git config user.name "MPHONlC"
          git config user.email "207844175+MPHONlC@users.noreply.github.com"
          git add DATA
          if git diff --cached --quiet; then
            echo "Own rows already current."
          else
            git commit -m "chore: own data rows for the new version [skip ci]"
            for ATTEMPT in 1 2 3 4; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
              sleep $((ATTEMPT * 5))
            done
          fi
