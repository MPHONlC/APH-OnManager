name: Broken Link Check

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README_BBCODE.txt'
      - 'README_COMMONMARK.txt'
      - 'CHANGELOG_GFM.txt'
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for broken links
        uses: ./.github/actions/broken-link-check
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
